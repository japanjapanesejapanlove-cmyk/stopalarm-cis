<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StopAlarm СНГ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131a2a;
      --card-2: #192238;
      --text: #f3f6fc;
      --muted: #93a1bd;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --pro: #c084fc;
      --border: rgba(255, 255, 255, 0.09);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 86px;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
      padding: 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0284c7, #22c55e);
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: 700;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.16);
      color: var(--accent);
      font-weight: 600;
    }

    .badge.pro {
      background: rgba(192, 132, 252, 0.2);
      color: var(--pro);
    }

    .brand-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .status-pill {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
    }

    .status-pill.active {
      color: #4ade80;
      border-color: rgba(74, 222, 128, 0.35);
      background: rgba(34, 197, 94, 0.12);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .row + .row {
      margin-top: 10px;
    }

    .wrap {
      flex-wrap: wrap;
    }

    select, input {
      width: 100%;
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 13px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.15s ease, background 0.15s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    button.primary {
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      border: none;
      color: #fff;
    }

    button.success {
      background: linear-gradient(135deg, #16a34a, #22c55e);
      border: none;
      color: #fff;
    }

    button.danger {
      background: rgba(239, 68, 68, 0.16);
      border-color: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    button.pro-btn {
      background: linear-gradient(135deg, #7e22ce, #c084fc);
      border: none;
      color: #fff;
    }

    button.chip.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
      color: var(--accent);
    }

    .map-box {
      position: relative;
      height: 270px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #0f172a;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .gps-float-btn {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 450;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .mode-tab {
      padding: 11px;
      text-align: center;
      border-radius: 12px;
      background: var(--card-2);
      border: 1px solid var(--border);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .mode-tab.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
    }

    .big-stat {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 4px 0;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .mini-box {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 10px;
    }

    .mini-label {
      font-size: 11px;
      color: var(--muted);
    }

    .mini-val {
      font-size: 14px;
      font-weight: 700;
      margin-top: 2px;
    }

    .stop-item, .log-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-top: 8px;
    }

    .star-btn {
      background: transparent;
      border: none;
      font-size: 18px;
      padding: 4px 6px;
      color: var(--muted);
    }

    .star-btn.fav {
      color: var(--warn);
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(19, 26, 42, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      z-index: 600;
    }

    .bottom-nav-inner {
      max-width: 560px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 6px 8px;
    }

    .nav-btn {
      background: transparent;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 4px;
      font-size: 11px;
      color: var(--muted);
      border-radius: 10px;
    }

    .nav-btn.active {
      color: var(--accent);
     </html>.
